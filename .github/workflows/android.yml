name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: debug_apk
        type: choice
        options:
          - debug_apk
          - release_apk
          - release_aab

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '9.6.0'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Resolve build target
        id: target
        shell: bash
        env:
          EVENT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          TARGET="${EVENT_TARGET:-debug_apk}"
          case "$TARGET" in
            debug_apk)
              TASK=":app:assembleDebug"
              ARTIFACT_NAME="devforge-debug-apk"
              ARTIFACT_PATH="app/build/outputs/apk/debug/app-debug.apk"
              ;;
            release_apk)
              TASK=":app:assembleRelease"
              ARTIFACT_NAME="devforge-release-apk"
              ARTIFACT_PATH="app/build/outputs/apk/release/*.apk"
              ;;
            release_aab)
              TASK=":app:bundleRelease"
              ARTIFACT_NAME="devforge-release-aab"
              ARTIFACT_PATH="app/build/outputs/bundle/release/*.aab"
              ;;
            *)
              echo "Unsupported build target: $TARGET" >&2
              exit 1
              ;;
          esac
          {
            echo "target=$TARGET"
            echo "task=$TASK"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "artifact_path=$ARTIFACT_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          "$ANDROID_SDKMANAGER" --list_installed | grep -E "platform-tools|platforms;${ANDROID_PLATFORM}|build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Build selected target
        run: gradle "${{ steps.target.outputs.task }}" --stacktrace --no-daemon --max-workers=2

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon --max-workers=2

      - name: Verify selected artifact
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.target.outputs.artifact_path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( $ARTIFACT_PATH )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Expected artifact was not produced: $ARTIFACT_PATH" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            test -s "$file"
            sha256sum "$file"
          done

      - name: Upload selected artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.artifact_name }}
          path: ${{ steps.target.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
