name: Bootstrap DevForge source import

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download exact DevForge source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3             -o /tmp/devforge-source.zip             "https://github.com/MrRedhood/DevForge/archive/f823bc65da886fd2752bacce7289be3a81a58519.zip"
          rm -rf /tmp/devforge-source
          mkdir -p /tmp/devforge-source
          unzip -q /tmp/devforge-source.zip -d /tmp/devforge-source
          SRC="$(find /tmp/devforge-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC"
          cp -a "$SRC/." "$GITHUB_WORKSPACE/"

      - name: Apply DevForge README
        shell: bash
        run: |
          set -euo pipefail
          cat > README.md <<'EOF'
# DevForge

## Code on Android. Build from anywhere. Ship without a desktop.

**DevForge turns an Android phone into a practical software-development command center — editor, AI chat, coding agents, Git, GitHub, terminal, automation, and cloud Android builds in one place.**

> **Write code. Ask AI. Let agents work. Commit. Build. Ship.**

DevForge is built around a simple idea: the screen already in your pocket can be a serious development workspace.

It is not a desktop IDE squeezed onto a phone. It is an Android-first workflow for developers who want to inspect projects, change code, work with GitHub, run controlled tools, and send APK/AAB builds to the cloud without constantly switching between separate apps.

[Download DevForge](https://github.com/MrRedhood/DevForge/releases) · [Explore the code](https://github.com/MrRedhood/DevForge)

![Android CI](https://github.com/MrRedhood/DevForge/actions/workflows/android.yml/badge.svg)
![Android UI Tests](https://github.com/MrRedhood/DevForge/actions/workflows/ui.yml/badge.svg)

---

## What makes DevForge different?

### A coding workspace that fits in your hand

Open a project, navigate files, edit code, search the workspace, inspect diffs, and keep the development loop on Android.

### AI that can actually work with the project

Chat with AI about the codebase, give controlled agents useful tools, and let approved mutations happen inside the workspace instead of treating AI as a detached text box.

AI output is treated as untrusted. Mutating actions are guarded by capability and approval controls.

### GitHub is part of the workspace, not a separate destination

Browse repositories, inspect commits, work with GitHub-backed projects, review changes, manage issues and pull requests, and create repositories from inside DevForge.

### The terminal has boundaries

The user terminal is available for development work. AI terminal execution is separately constrained by command policy, allowlists, timeouts, output limits, and approval controls.

### Builds leave the phone — without leaving the workflow

DevForge's Build Center uses GitHub Actions for:

- Debug APK
- Release APK
- Release AAB
- Build artifacts
- Lint reports
- Unit-test reports
- Dependency reports

You can monitor runs, inspect logs, and pull generated artifacts back to the Android device.

---

