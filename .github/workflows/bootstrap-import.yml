## Core workflow

Open workspace → Read / edit code → Ask AI → Run approved agent actions → Review changes → Commit with Git → Run GitHub Actions → Download APK / AAB / reports

The goal is not to make Android development feel like a compromise. The goal is to make the mobile workflow feel intentional.

---

## What you can do today

### Code & workspaces

- Multiple local workspaces and GitHub-backed repositories
- Project tree navigation
- File and folder create / edit / rename / delete
- Editor tabs, split editor, search, replace, quick open, go-to-line, symbols, folding, problems, breadcrumbs, and local history
- Workspace backup and recovery
- Workspace-aware AI context and search

### AI development

- Multi-provider AI chat
- Project-aware context
- Controlled file mutations through agent tools
- AI terminal execution through bounded command policy
- Read-only Git history access through get_git_log
- Separate Chat and Agent execution controls
- Capability grants and approval-aware mutations

### Git & GitHub

- Git status, diffs, commits, history, and reversible commit workflows
- GitHub repository browsing and editing
- Issues and pull requests
- Repository creation and in-app repository deletion
- GitHub-backed workspace editing and commits
- Commit inspection with changed-file details

### Build & delivery

- GitHub Actions Build Center
- Debug APK, Release APK, Release AAB
- Artifact publication controls
- Lint, unit-test, and dependency reports
- Live workflow status and logs
- Artifact downloads directly to the Android device
- Build-failure diagnosis

### Automation & safety

- Scheduled development automations
- Approval-controlled mutating actions
- Scoped capability grants
- Bounded tool inputs and outputs
- Diagnostics and recovery
- Offline action queue
- Workspace backup

---

## Security model

DevForge is designed around a simple rule:

> **AI can propose work. Policy decides what the app is allowed to do.**

The project treats AI output as untrusted, scopes tool access through capabilities, requires appropriate approval for mutating actions, constrains terminal commands, and keeps secrets out of normal application storage.

---

## Who is DevForge for?

**Android developers** who want a serious mobile coding workflow.

**AI-assisted developers** who want project-aware agents instead of a standalone chatbot.

**Students and learners** who want to work with real repositories from Android.

**Remote developers** who sometimes have a phone, a repository, and a problem — but no desktop nearby.

---

## Why the project exists

A lot of development tooling assumes the desktop is the center of everything.

DevForge starts from a different constraint:

**What if Android is the primary development screen?**

That changes the priorities. Navigation has to be fast. Workspace state has to be durable. AI actions need boundaries. GitHub needs to feel native to the workflow. And heavy Android builds can move to cloud CI without breaking the loop.

That is the problem DevForge is built to solve.

---

