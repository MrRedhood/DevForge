      - name: Record clean repository bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cat >> IMPLEMENTATION.md <<'EOF'

## 2026-09-22 — Clean repository bootstrap import

The empty MrRedhood/DevForge repository was initialized from the validated DevForge source snapshot at commit f823bc65da886fd2752bacce7289be3a81a58519.

The import preserves the tracked project source, tests, Gradle wrapper, GitHub Actions workflows, documentation, and repository screenshots. Git history from the previous repository is intentionally not copied.

The repository README was refreshed during the bootstrap to use distinctive DevForge positioning while keeping feature claims aligned with the implemented application.

The bootstrap workflow is temporary and removes itself after the source import completes.
EOF

      - name: Finalize repository
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew 2>/dev/null || true
          chmod +x tools/check-build-budget.sh 2>/dev/null || true
          rm -f .github/workflows/bootstrap-import.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git status --short

          if git diff --cached --quiet; then
            echo "No repository changes detected."
            exit 0
          fi

          git commit -m "Import DevForge source baseline"
          git push origin HEAD:main
