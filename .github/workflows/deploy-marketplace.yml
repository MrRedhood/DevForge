name: Deploy DevForge Marketplace

on:
  push:
    branches: [main]
    paths:
      - "marketplace/**"
      - ".github/workflows/deploy-marketplace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-devforge-marketplace
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Configure Marketplace resources
        env:
          D1_DATABASE_ID: ${{ secrets.DEVFORGE_MARKETPLACE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/g" wrangler.toml

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute devforge-marketplace --remote --file=./schema.sql

      - name: Deploy Marketplace Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy
