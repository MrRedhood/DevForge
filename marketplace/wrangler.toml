name = "devforge-marketplace-api"
main = "src/worker.js"
compatibility_date = "2026-09-23"

[vars]
MARKETPLACE_API_VERSION = "1"
MAX_PACKAGE_BYTES = "67108864"

[[d1_databases]]
binding = "DB"
database_name = "devforge-marketplace"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "devforge-marketplace-packages"
